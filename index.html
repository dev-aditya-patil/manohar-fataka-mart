<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manohar Enterprises · Price Finder</title>
  <meta name="description" content="Manohar Enterprises, Malkapur: search products and check prices instantly.">
  <meta name="theme-color" content="#7a1f2b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Manohar Enterprises</h1>
      <p>Product &amp; Price Finder · Malkapur</p>
    </div>
    <button class="icon-btn" id="contactToggle" type="button" aria-expanded="false" aria-controls="contactPanel" aria-label="Show contact numbers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
    </button>
  </header>

  <div class="contact-panel" id="contactPanel" hidden>
    <a class="contact-btn" href="tel:+919823121511"><span>Call</span> 98231 21511</a>
    <a class="contact-btn" href="tel:+919767129653"><span>Call</span> 97671 29653</a>
    <a class="contact-btn wide" href="mailto:manoharenterprises17@gmail.com"><span>Email</span> manoharenterprises17@gmail.com</a>
  </div>

  <div class="controls" id="controls">
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
      <input id="search" type="search" placeholder="Search product, brand, category..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search products" autofocus>
      <button class="clear-btn" id="clearSearch" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4-6.3-6.3-6.3 6.3-1.4-1.4L10.6 12 4.3 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </button>
    </div>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <div class="toolbar">
      <p class="count" id="count" aria-live="polite">Loading products…</p>
      <button class="reset-btn" id="resetFilters" type="button" hidden>Reset</button>
      <label class="sort">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8h3v12h2V8h3L7 4zm10 16 4-4h-3V4h-2v12h-3l4 4z"/></svg>
        <span id="sortLabel">Sort</span>
        <select id="sort" aria-label="Sort products">
          <option value="default">Default order</option>
          <option value="name">Name: A–Z</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </label>
    </div>
  </div>

  <main>
    <ul class="results" id="results"></ul>
    <div class="empty" id="empty" hidden></div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <footer class="footer" id="contact">
    <h2>Contact</h2>
    <div class="contact-grid">
      <a class="contact-btn" href="tel:+919823121511"><span>Call</span> 98231 21511</a>
      <a class="contact-btn" href="tel:+919767129653"><span>Call</span> 97671 29653</a>
      <a class="contact-btn wide" href="mailto:manoharenterprises17@gmail.com"><span>Email</span> manoharenterprises17@gmail.com</a>
    </div>
    <address>Cotton Market, Near Court, Malkapur</address>
    <p class="fine" id="dataNote"></p>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.6 4.7 12.9l1.4 1.4L11 9.4V20h2V9.4l4.9 4.9 1.4-1.4z"/></svg>
  </button>

  <script src="app.js" defer></script>
</body>
</html>
